<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sin CSP inline: la app no carga nada remoto. Se declara explícitamente
      que no hay red, no por pereza sino para que nadie añada un CDN sin
      darse cuenta de que está abriendo la puerta del renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <title>FixMyPhone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-electron.tsx"></script>
  </body>
</html>
