# FixMyPhone - curacion manual de dispositivos
#
# Este archivo es la UNICA via por la que un humano agrega conocimiento que las
# fuentes publicas no traen (SoC de siliconio reciente, codenames de Samsung/Xiaomi
# que LineageOS no soporta, particiones de la placa, equivalencia de refacciones).
#
# Reglas:
#   1. Todo lo que se escriba aqui tiene confidence='manual' y REVISADO por una
#      persona. No es un hecho automatico: si te equivocas, se danan equipos.
#   2. Toda entrada debe traer `verified_by` y `evidence` (una URL o una nota de
#      donde salio el dato). Sin evidencia, la entrada se rechaza.
#   3. El pipeline NUNCA sobrescribe un campo que ya viene confirmado por una
#      fuente publica; solo rellena huecos o lo marca para revision.
#
# Formato por dispositivo (clave = codename AOSP):
#
# devices:
#   rq3q:
#     vendor: Samsung
#     marketing_name: Galaxy A54 5G
#     soc_raw: Samsung Exynos 1380
#     model_numbers: [SM-A546E, SM-A546B, SM-A546U]
#     is_ab_device: true
#     recovery_partition_name: recovery
#     verified_by: "curacion@fixmyphone 2026-09-26"
#     evidence: "kernel repo + manual de servicio; confirmar en unidad real"

devices:
  rq3q:
    vendor: Samsung
    marketing_name: Galaxy A54 5G
    soc_raw: Samsung Exynos 1380
    model_numbers: [SM-A546E, SM-A546B, SM-A546U, SM-A546U1, SM-A546X]
    android_version: 13
    is_ab_device: true
    recovery_partition_name: recovery
    verified_by: "curacion@fixmyphone 2026-09-26"
    evidence: "variante global Exynos 1380; la variante Snapdragon 6 Gen 1 usa otra placa - NO mezclar"
    confidence: "manual"

  rq3a:
    vendor: Samsung
    marketing_name: Galaxy A14
    soc_raw: Samsung Exynos 850
    model_numbers: [SM-A145F, SM-A145M, SM-A145F/DS]
    android_version: 14
    is_ab_device: true
    recovery_partition_name: recovery
    verified_by: "curacion@fixmyphone 2026-09-26"
    evidence: "modelo base Exynos 850; confirmar si el A14 5G usa otra variante"
    confidence: "manual"

